name: Compilacion automatica de archivos del proyecto

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Obtener codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar y Compilar Panel de Control C#
      run: dotnet build IntelControlPanel.csproj -c Release

    - name: Compilar Cliente C++ (CMake)
      run: |
        cmake -B build -S .
        cmake --build build --config Release

    - name: Empaquetar artefactos compilados
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release_files
        if (Test-Path "bin/Release/net8.0-windows") { Copy-Item "bin/Release/net8.0-windows/*" "release_files/" -Recurse -Force }
        if (Test-Path "build/Release") { Copy-Item "build/Release/*" "release_files/" -Recurse -Force }
        if (Test-Path "intel_hd4000.inf") { Copy-Item "intel_hd4000.inf" "release_files/" -Force }
        if (Test-Path "intel_hd4000_kmd.c") { Copy-Item "intel_hd4000_kmd.c" "release_files/" -Force }

    - name: Subir artefactos de compilacion
      uses: actions/upload-artifact@v4
      with:
        name: IntelHD4000_Driver_Release
        path: release_files/
